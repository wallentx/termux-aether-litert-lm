name: Pixel TPU runtime

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pixel-tpu-runtime-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      LITERT_LM_REF: 5e58e9a0aef7abf7091207a8b1d1063a1c800f08 # v0.17.1
      NDK_VERSION: 28.1.13356709
    steps:
      - name: Check out fork source
        uses: actions/checkout@v7
        with:
          lfs: true
          persist-credentials: false

      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install build tools
        run: |
          sdkmanager "ndk;$NDK_VERSION" 'platforms;android-34' 'build-tools;34.0.0'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          npm install --global --prefix "$RUNNER_TEMP/bazelisk" @bazel/bazelisk@1.28.1
          echo "$RUNNER_TEMP/bazelisk/bin" >> "$GITHUB_PATH"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libssl-dev zlib1g-dev

      - name: Build Android ARM64 runtime and matching Tensor dispatch
        run: |
          bazelisk --host_jvm_args=-Xmx2048m build \
            --config=android_arm64 --deleted_packages=swift \
            --jobs=4 --local_ram_resources=8192 \
            //runtime/engine:litert_lm_main \
            @litert//litert/vendors/google_tensor/dispatch:dispatch_api_so \
            @litert//litert/c:litert_runtime_c_api_so \
            2>&1 | tee "$RUNNER_TEMP/tpu-build.log"

      - name: Package runtime and provenance
        run: |
          set -x
          test -f AETHER_VERSION
          fork_version="$(cat AETHER_VERSION)"
          if ! [[ "$fork_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[1-9][0-9]{3,}$ ]] || [ "$(wc -l < AETHER_VERSION)" -ne 1 ]; then
            echo "AETHER_VERSION must contain one numeric major.minor.upstream-patch.aether-sequence version with sequence >= 1000" >&2
            exit 1
          fi
          fork_tag="aether/v$fork_version"
          mkdir -p artifact
          cp bazel-bin/runtime/engine/litert_lm_main artifact/
          cp prebuilt/android_arm64/*.so artifact/
          for target in \
            @litert//litert/vendors/google_tensor/dispatch:dispatch_api_so \
            @litert//litert/c:litert_runtime_c_api_so; do
            bazelisk --host_jvm_args=-Xmx2048m cquery --config=android_arm64 --deleted_packages=swift \
              --output=files "$target" > "$RUNNER_TEMP/target-files.txt"
            copied=0
            while IFS= read -r output; do
              if [[ "$output" == *.so && -f "$output" ]]; then
                cp "$output" artifact/
                copied=$((copied + 1))
              fi
            done < "$RUNNER_TEMP/target-files.txt"
            if [[ "$copied" -eq 0 ]]; then
              echo "No shared library output found for $target" >&2
              cat "$RUNNER_TEMP/target-files.txt" >&2
              exit 1
            fi
          done
          test -s artifact/libLiteRtDispatch_GoogleTensor.so
          test -s artifact/libLiteRt.so
          test -s artifact/libGemmaModelConstraintProvider.so
          toolchain="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          for binary in artifact/litert_lm_main artifact/*.so; do
            "$toolchain/llvm-readelf" -h "$binary" > "$binary.header.txt"
            grep -q AArch64 "$binary.header.txt"
            "$toolchain/llvm-readelf" -d "$binary" > "$binary.dynamic.txt"
          done
          git rev-parse HEAD > artifact/source-commit.txt
          printf '%s\n' "$fork_version" > artifact/aether-fork-version.txt
          printf '%s\n' "$fork_tag" > artifact/aether-fork-tag.txt
          printf '%s\n' "$LITERT_LM_REF" > artifact/upstream-base-commit.txt
          printf '%s\n' 'v0.17.1' > artifact/upstream-base-version.txt
          cp AETHER_VERSION WORKSPACE .bazelversion LICENSE artifact/
          "$toolchain/clang" --version > artifact/compiler.txt
          printf 'Termux-Aether LiteRT-LM fork release %s\nFork version %s\nUpstream LiteRT-LM v0.17.1 (%s)\nNDK %s\nBazelisk 1.28.1\n' "$fork_tag" "$fork_version" "$LITERT_LM_REF" "$NDK_VERSION" > artifact/build-version.txt
          (cd artifact && sha256sum -- * > SHA256SUMS)

      - uses: actions/upload-artifact@v7
        with:
          name: pixel-tpu-arm64
          path: artifact/
          archive: true
          if-no-files-found: error
          retention-days: 14

      - name: Preserve build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pixel-tpu-build-log
          path: ${{ runner.temp }}/tpu-build.log
          if-no-files-found: ignore
          retention-days: 14
